name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: |
          swift test
          python3 scripts/check-l10n.py
      - name: Build
        run: |
          V="${GITHUB_REF_NAME#v}"
          VERSION="$V" scripts/build-app.sh
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/LidOn.app "dist/LidOn-$V.zip"
          (cd dist && shasum -a 256 "LidOn-$V.zip" > "LidOn-$V.zip.sha256")
          SHA=$(cut -d' ' -f1 "dist/LidOn-$V.zip.sha256")
          sed -e "s|__VERSION__|$V|" -e "s|__SHA256__|$SHA|" -e "s|__REPO__|$GITHUB_REPOSITORY|g" \
            packaging/lidon.rb.template > dist/lidon.rb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/LidOn-$V.zip dist/LidOn-$V.zip.sha256 dist/lidon.rb \
            --title "LidOn $V" --generate-notes
