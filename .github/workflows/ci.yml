name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Translations
        run: python3 scripts/check-l10n.py
      - name: Build app (universal)
        run: scripts/build-app.sh
